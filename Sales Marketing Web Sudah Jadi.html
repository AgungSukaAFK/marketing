        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }
      body {
        background: #060913;
        color: #e2e8f0;
      }
      .glass {
        background: rgba(12, 19, 34, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .card {
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .btn {
        transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.15);
      }
      .fade {
        animation: f 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal {
        animation: m 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes m {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .toast {
        animation: t 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes t {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 99px;
      }
      .compact .card {
        padding: 0.6rem !important;
      }
    </style>

          name: currentUser.name,

      function getOnlineUsers() {
        const p = getObj("presence");
        const now = Date.now();
        return Object.entries(p)
          .filter(
            ([_, v]) =>
              now - new Date(v.lastActiveAt).getTime() < 3 * 60 * 1000,
          )
          .map(([username, v]) => ({ username, ...v }));
      }
      setInterval(() => {
        if (currentUser) updatePresence();
      }, 30000);

      // EXPORT
      function exportExcel(data, filename) {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, filename + ".xlsx");
      }
      function exportPDF(data, filename) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF("l", "mm", "a4");
        doc.text(filename, 14, 14);
        if (data.length) {
          const cols = Object.keys(data[0]);
          const rows = data.map((r) => cols.map((c) => String(r[c] ?? "")));
          doc.autoTable({
            head: [cols],
            body: rows,
            startY: 20,
            styles: { fontSize: 6 },
            headStyles: { fillColor: [16, 185, 129] },
          });
        }
        doc.save(filename + ".pdf");
      }
      function exportWord(data, filename) {
        let html =
          "<table border=1><tr>" +
          Object.keys(data[0] || {})
            .map((c) => `<th>${c}</th>`)
            .join("") +
          "</tr>" +
          data
            .map(
              (r) =>
                "<tr>" +
                Object.values(r)
                  .map((v) => `<td>${v ?? ""}</td>`)
                  .join("") +
                "</tr>",
            )
            .join("") +
          "</table>";
        const blob = new Blob(["\ufeff", html], { type: "application/msword" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename + ".doc";
        a.click();
      }

    <div id="box-forgot" class="hidden"><h2 class="text-xl font-bold">Lupa Password</h2><div class="mt-6 space-y-3" id="fg1"><input id="f_user" placeholder="Username" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10"><button onclick="doFg1()" class="w-full py-3 rounded-xl font-bold" style="background:var(--accent);color:#000">Cek</button></div><div id="fg2" class="hidden space-y-3 mt-4"><p id="f_q" class="text-sm opacity-70"></p><input id="f_a" placeholder="Jawaban" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10"><input id="f_new" type="password" placeholder="Password Baru" class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10"><button onclick="doFg2()" class="w-full py-3 rounded-xl font-bold" style="background:var(--accent);color:#000">Reset</button></div><a href="#" onclick="showBox('login')" class="text-xs" style="color:var(--accent)">Kembali</a></div>
   </div>
  </div>
 </div>`;
        lucide.createIcons();
      }
      function showBox(k) {
        document
          .getElementById("box-login")
          .classList.toggle("hidden", k !== "login");
        document
          .getElementById("box-reg")
          .classList.toggle("hidden", k !== "reg");
        document
          .getElementById("box-forgot")
          .classList.toggle("hidden", k !== "forgot");
      }
      function doLogin() {
        const u = document.getElementById("l_user").value.trim(),
          p = document.getElementById("l_pass").value;
        const users = g("users");
        const f = users.find((x) => x.username === u && x.password === p);
        if (!f) return toast("Username/password salah", true);
        if (!f.active) return toast("Akun nonaktif", true);
        currentUser = f;
        localStorage.setItem("titan_current", JSON.stringify(f));
        updatePresence();
        addLoginHistory(f.username, "LOGIN");
        renderApp();
      }
      function doReg() {
        const name = document.getElementById("r_name").value,
          user = document.getElementById("r_user").value.trim(),
          pass = document.getElementById("r_pass").value,
          q = document.getElementById("r_q").value,
          a = document.getElementById("r_a").value;
        if (!name || !user || !pass || !q || !a) return toast("Lengkapi", true);
        let users = g("users");
        if (users.find((u) => u.username === user))
          return toast("Username ada", true);
        users.push({
          username: user,
          password: pass,
          name,
          role: "Sales",
          securityQ: q,
          securityA: a.toLowerCase(),
          active: true,
          createdAt: new Date().toISOString(),
        });
        s("users", users);
        toast("Registrasi berhasil");
        showBox("login");
      }
      let fgUser = null;
      function doFg1() {
        const u = document.getElementById("f_user").value.trim();
        const f = g("users").find((x) => x.username === u);
        if (!f) return toast("User tidak ditemukan", true);
        fgUser = f;
        document.getElementById("f_q").innerText = "Q: " + f.securityQ;
        document.getElementById("fg1").classList.add("hidden");
        document.getElementById("fg2").classList.remove("hidden");
      }
      function doFg2() {
        const ans = document.getElementById("f_a").value.toLowerCase(),
          np = document.getElementById("f_new").value;
        if (ans !== fgUser.securityA.toLowerCase())
          return toast("Jawaban salah", true);
        let users = g("users");
        users = users.map((u) =>
          u.username === fgUser.username ? { ...u, password: np } : u,
        );
        s("users", users);
        toast("Password direset");
        showBox("login");
      }
      function logout() {
        if (currentUser) addLoginHistory(currentUser.username, "LOGOUT");
        localStorage.removeItem("titan_current");
        currentUser = null;
        renderLogin();
      }

      // MAIN LAYOUT
      function getAllMenus() {
        const base = BASE_MENUS;
        const custom = g("custom_menus").map((c) => ({
          id: c.id,
          label: c.label,
          icon: c.icon || "file-text",
          custom: true,
        }));
        return [...base, ...custom];
      }
      function getVisibleMenusForCurrentUser() {
        const order = g("menu_order");
        const vis = getObj("menu_visibility");
        const labels = getObj("menu_labels");
        const icons = getObj("menu_icons");
        const access = getObj("access_control");
        let all = getAllMenus();
        // sort by order
        let ordered = order
          .map((id) => all.find((m) => m.id === id))
          .filter(Boolean);
        // append not in order
        all.forEach((m) => {
          if (!ordered.find((o) => o.id === m.id)) ordered.push(m);
        });
        // filter by global visibility
        ordered = ordered.filter((m) => vis[m.id] !== false);
        // filter by role
        ordered = ordered.filter((m) => {
          if (m.roles && !m.roles.includes(currentUser.role)) return false;
          return true;
        });
        // filter by per-account access control (if exists)
        if (currentUser.role !== "Master") {
          const myAccess = access[currentUser.username];
          if (myAccess && myAccess.enabled) {
            ordered = ordered.filter((m) => myAccess.allowed.includes(m.id));
          }
        }
        return { ordered, labels, icons };
      }
      function renderApp() {
        if (!currentUser) {
          renderLogin();
          return;
        }
        applyTheme();
        updatePresence();
        const cfg = getObj("header_cfg");
        const {
          ordered: menus,
          labels,
          icons,
        } = getVisibleMenusForCurrentUser();
        const online = getOnlineUsers();
        document.getElementById("app").innerHTML = `
 <div class="flex min-h-screen">
  <div id="ov" onclick="toggleSide()" class="fixed inset-0 bg-black/60 z-30 lg:hidden ${sidebarOpen ? "" : "hidden"}"></div>
  <aside id="side" class="fixed lg:static inset-y-0 left-0 z-40 w-72 glass flex flex-col transform transition-all duration-200 ${sidebarOpen ? "translate-x-0" : "-translate-x-full lg:translate-x-0"}">
   <div class="p-5 flex justify-between border-b border-white/10"><div><h1 class="font-bold text-lg" style="color:var(--accent)" id="appName">${getObj("app_settings").appName}</h1><p class="text-[10px] opacity-50 tracking-widest">INDUSTRIAL & MINING CRM</p></div><button class="lg:hidden" onclick="toggleSide()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
   <div class="flex-1 overflow-y-auto p-3 space-y-1" id="menuList">
    ${menus
      .map((m) => {
        const lb = labels[m.id] || m.label;
        const ic = icons[m.id] || m.icon;
        return `<button onclick="go('${m.id}')" id="m-${m.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm ${activeMenu === m.id ? "font-bold" : ""} hover:bg-white/5" style="${activeMenu === m.id ? `background:var(--accent);color:#000` : ""}"><i data-lucide="${ic}" class="w-4 h-4"></i> ${lb}${m.custom ? '<span class="ml-auto text-[9px] opacity-50">CUSTOM</span>' : ""}</button>`;
      })
      .join("")}
   </div>
   <div class="p-3 border-t border-white/10 text-[11px] opacity-60"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${currentUser.name} (${currentUser.role})</div></div>
  </aside>
  <main class="flex-1 flex flex-col min-w-0">
   <div class="glass sticky top-0 z-20 flex items-center justify-between px-4 md:px-6 py-3">
    <div class="flex items-center gap-3"><button class="lg:hidden p-2 rounded-xl bg-white/5" onclick="toggleSide()"><i data-lucide="menu" class="w-5 h-5"></i></button><h2 id="modTitle" class="font-bold text-base md:text-lg"></h2></div>
    <div class="flex items-center gap-2 md:gap-3">
     ${cfg.showClock ? `<div class="hidden md:flex items-center gap-2 text-xs opacity-70"><i data-lucide="clock" class="w-4 h-4"></i><span id="clock"></span></div>` : ""}
     ${cfg.showBadge ? `<span class="hidden md:inline-flex px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 text-[10px]">Live</span>` : ""}
     ${cfg.showOnline && ["Master", "Admin"].includes(currentUser.role) ? `<div class="relative"><button onclick="toggleOnlineDrop()" class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white/5 text-xs"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Online ${online.length} <i data-lucide="chevron-down" class="w-3 h-3"></i></button><div id="onlineDrop" class="hidden absolute right-0 mt-2 w-72 glass card p-3 z-50 max-h-80 overflow-y-auto"><h4 class="font-bold text-xs mb-2">Akun Online (${online.length})</h4>${online.map((o) => `<div class="flex justify-between text-xs bg-white/5 p-2 rounded mb-1"><span>${o.name} (${o.role})</span><span class="opacity-60">${new Date(o.lastActiveAt).toLocaleTimeString("id-ID")}</span></div>`).join("") || '<div class="text-xs opacity-50">Tidak ada</div>'}<button onclick="go('akun')" class="mt-2 w-full py-2 rounded-xl text-xs font-bold" style="background:var(--accent);color:#000">Lihat Riwayat Login</button></div></div>` : ""}
     <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full flex items-center justify-center text-black font-bold text-xs" style="background:var(--accent)">${currentUser.name.charAt(0)}</div><div class="hidden md:block text-xs leading-tight"><div class="font-bold">${currentUser.name}</div><div class="opacity-60">${currentUser.role}</div></div><button onclick="logout()" class="ml-2 px-3 py-1.5 rounded-xl bg-white/5 text-xs">Logout</button></div>
    </div>
   </div>
   <div id="content" class="p-4 md:p-6 flex-1 fade overflow-y-auto"></div>
  </main>
 </div>`;
        lucide.createIcons();
        startClock();
        go(activeMenu);
      }
      function toggleSide() {
        sidebarOpen = !sidebarOpen;
        document
          .getElementById("side")
          .classList.toggle("-translate-x-full", !sidebarOpen);
        document.getElementById("ov").classList.toggle("hidden", !sidebarOpen);
      }
      function go(id) {
        activeMenu = id;
        const { ordered, labels, icons } = getVisibleMenusForCurrentUser();
        if (!ordered.find((m) => m.id === id)) {
          if (currentUser.role === "Sales")
            return toast("Akses ditolak oleh Master", true);
        }
        document.querySelectorAll("[id^=m-]").forEach((b) => {
          b.style.background = "";
          b.style.color = "";
        });
        const el = document.getElementById("m-" + id);
        if (el) {
          el.style.background = "var(--accent)";
          el.style.color = "#000";
        }
        const def =
          ordered.find((m) => m.id === id) ||
          getAllMenus().find((m) => m.id === id);
        document.getElementById("modTitle").textContent =
          getObj("menu_labels")[id] || def?.label || id;
        if (window.innerWidth < 1024 && sidebarOpen) toggleSide();
        renderModule(id);
      }
      function startClock() {
        setInterval(() => {
          const el = document.getElementById("clock");
          if (el)
            el.textContent =
              new Date().toLocaleString("id-ID", {
                timeZone: "Asia/Jakarta",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
              }) + " WIB";
        }, 1000);
      }
      function toggleOnlineDrop() {
        document.getElementById("onlineDrop")?.classList.toggle("hidden");
      }

      // GENERIC TABLE + TOOLBAR
      function toolbar(k) {
        return `<div class="flex flex-wrap gap-2 mb-4"><button onclick="openForm('${k}')" class="px-4 py-2 rounded-xl text-sm font-bold" style="background:var(--accent);color:#000">+ Input/Tambah</button><label class="px-3 py-2 rounded-xl bg-white/5 text-sm cursor-pointer">Import<input type="file" class="hidden" onchange="importExcel(event,'${k}')"></label><button onclick="handleExport('${k}','excel')" class="px-3 py-2 rounded-xl bg-white/5 text-sm">Excel</button><button onclick="handleExport('${k}','pdf')" class="px-3 py-2 rounded-xl bg-white/5 text-sm">PDF</button><button onclick="handleExport('${k}','word')" class="px-3 py-2 rounded-xl bg-white/5 text-sm">Word</button></div>`;
      }
      function handleExport(key, type) {
        let data = filterOwner(g(key));
        if (!data.length) return toast("Tidak ada data", true);
        if (type === "excel") exportExcel(data, key);
        if (type === "pdf") exportPDF(data, key);
        if (type === "word") exportWord(data, key);
      }
      function importExcel(e, key) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const wb = XLSX.read(ev.target.result, { type: "binary" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(ws);
          let existing = g(key);
          json.forEach((r) => {
            r.id = uid();
            r.owner = currentUser.username;
            r.createdAt = new Date().toISOString();
          });
          s(key, [...existing, ...json]);
          toast("Import berhasil");
          renderModule(activeMenu);
        };
        reader.readAsBinaryString(file);
      }
      function delRow(k, id) {
        if (!confirm("Hapus?")) return;
        s(
          k,
          g(k).filter((r) => r.id !== id),
        );
        toast("Dihapus");
        renderModule(activeMenu);
      }

      // MODULE RENDERS (compact reusable)
      function renderCustomer() {
        const data = filterOwner(g("customers"));
        return `${toolbar("customers")}<div class="overflow-x-auto card"><table class="w-full text-sm"><thead class="sticky top-0 z-10 bg-[#0c1322]"><tr>${["No", "Code", "Sales", "PT", "PIC", "WA", "Email", "Jabatan", "Site", "Note", "Aksi"].map((h) => `<th class="px-3 py-2 text-left whitespace-nowrap">${h}</th>`).join("")}</tr></thead><tbody>${data.map((r, i) => `<tr class="border-t border-white/5"><td class="px-3 py-2 whitespace-nowrap">${i + 1}</td><td class="px-3 py-2 whitespace-nowrap font-mono" style="color:var(--accent)">${r.customer_code}</td><td class="px-3 py-2 whitespace-nowrap">${r.sales}</td><td class="px-3 py-2 whitespace-nowrap">${r.pt}</td><td class="px-3 py-2 whitespace-nowrap">${r.pic}</td><td class="px-3 py-2 whitespace-nowrap">${r.wa}</td><td class="px-3 py-2 whitespace-nowrap">${r.email}</td><td class="px-3 py-2 whitespace-nowrap">${r.jabatan}</td><td class="px-3 py-2 whitespace-nowrap">${r.site}</td><td class="px-3 py-2 whitespace-nowrap">${r.note}</td><td class="px-3 py-2 whitespace-nowrap flex gap-1"><button onclick="openForm('customers','${r.id}')" class="p-1 bg-white/5 rounded">Edit</button><button onclick="delRow('customers','${r.id}')" class="p-1 bg-red-500/20 rounded">Del</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function renderSalesDaily() {
        const data = filterOwner(g("sales_daily"));
        const custs = g("customers");
        if (!custs.length)
          return `<div class="card p-6 text-center">Isi Customer DB dulu <button onclick="go('customer')" class="underline" style="color:var(--accent)">Customer DB</button></div>`;
        const comp = data.filter((d) => d.status === "Completed"),
          pend = data.filter((d) => d.status !== "Completed");
        return `${toolbar("sales_daily")}<div class="flex gap-2 mb-3"><button onclick="setSD('board')" class="px-3 py-1 rounded bg-white/5 text-xs">Board</button><button onclick="setSD('table')" class="px-3 py-1 rounded bg-white/5 text-xs">Table</button></div><div id="sd">${sdView === "board" ? renderSDBoard(comp, pend) : renderSDTable(data)}</div>`;
      }
      function setSD(v) {
        sdView = v;
        const data = filterOwner(g("sales_daily"));
        const comp = data.filter((d) => d.status === "Completed"),
          pend = data.filter((d) => d.status !== "Completed");
        document.getElementById("sd").innerHTML =
          v === "board" ? renderSDBoard(comp, pend) : renderSDTable(data);
        lucide.createIcons();
      }
      function renderSDBoard(comp, pend) {
        const card = (r) =>
          `<div class="card p-3 mb-2"><div class="flex justify-between"><span class="font-mono text-xs" style="color:var(--accent)">${r.customer_code}</span><span class="text-[10px] px-2 py-0.5 rounded bg-white/10">${r.status}</span></div><div class="font-bold text-sm">${r.pt}</div><div class="text-xs opacity-60">${r.type} • ${r.pic}</div><div class="text-xs mt-1">${r.note}</div><div class="flex gap-1 mt-2"><button onclick="createPipe('${r.id}')" class="text-[10px] px-2 py-1 rounded font-bold" style="background:var(--accent);color:#000">Buat Pipeline</button><button onclick="openForm('sales_daily','${r.id}')" class="text-[10px] px-2 py-1 rounded bg-white/5">Edit</button><button onclick="delRow('sales_daily','${r.id}')" class="text-[10px] px-2 py-1 rounded bg-red-500/20">Del</button></div></div>`;
        return `<div class="grid md:grid-cols-2 gap-4"><div><h4 class="font-bold text-xs mb-2">Completed (${comp.length})</h4>${comp.map(card).join("") || "-"}</div><div><h4 class="font-bold text-xs mb-2">Pending (${pend.length})</h4>${pend.map(card).join("") || "-"}</div></div>`;
      }
      function renderSDTable(data) {
        return `<div class="overflow-x-auto card"><table class="w-full text-sm"><thead class="sticky top-0 z-10 bg-[#0c1322]"><tr>${["Code", "Type", "PT", "PIC", "Status", "Note", "Owner", "Aksi"].map((h) => `<th class="px-3 py-2 whitespace-nowrap">${h}</th>`).join("")}</tr></thead><tbody>${data.map((r) => `<tr class="border-t border-white/5"><td class="px-3 py-2 whitespace-nowrap">${r.customer_code}</td><td class="px-3 py-2 whitespace-nowrap">${r.type}</td><td class="px-3 py-2 whitespace-nowrap">${r.pt}</td><td class="px-3 py-2 whitespace-nowrap">${r.pic}</td><td class="px-3 py-2 whitespace-nowrap">${r.status}</td><td class="px-3 py-2 whitespace-nowrap">${r.note}</td><td class="px-3 py-2 whitespace-nowrap">${r.owner}</td><td class="px-3 py-2 whitespace-nowrap"><button onclick="createPipe('${r.id}')" class="px-2 py-1 text-xs rounded font-bold" style="background:var(--accent);color:#000">Pipeline</button> <button onclick="openForm('sales_daily','${r.id}')" class="px-1 bg-white/5 rounded">E</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function createPipe(id) {
        const act = g("sales_daily").find((a) => a.id === id);
        if (!act) return;
        let pipe = g("pipeline");
        pipe.push({
          id: uid(),
          customer_code: act.customer_code,
          pt: act.pt,
          sales: act.owner,
          stage: "Market Map",
          value: 100000000,
          product: act.note.slice(0, 30),
          prob: 10,
          owner: act.owner,
          createdAt: new Date().toISOString(),
        });
        s("pipeline", pipe);
        toast("Pipeline dibuat");
        go("pipeline");
      }
      function renderAdminDaily() {
        const data = filterOwner(g("admin_daily"));
        return `${toolbar("admin_daily")}<div class="overflow-x-auto card"><table class="w-full text-sm"><thead class="sticky top-0 z-10 bg-[#0c1322]"><tr>${["Code", "Type", "Ref", "PT", "Dok", "Status", "Owner", "Aksi"].map((h) => `<th class="px-3 py-2 whitespace-nowrap">${h}</th>`).join("")}</tr></thead><tbody>${data.map((r) => `<tr class="border-t border-white/5"><td class="px-3 py-2 whitespace-nowrap">${r.customer_code}</td><td class="px-3 py-2 whitespace-nowrap">${r.type}</td><td class="px-3 py-2 whitespace-nowrap">${r.ref_no}</td><td class="px-3 py-2 whitespace-nowrap">${r.pt}</td><td class="px-3 py-2 whitespace-nowrap">${r.dokumen}</td><td class="px-3 py-2 whitespace-nowrap">${r.status}</td><td class="px-3 py-2 whitespace-nowrap">${r.owner}</td><td class="px-3 py-2 whitespace-nowrap"><button onclick="openForm('admin_daily','${r.id}')" class="p-1 bg-white/5 rounded">Edit</button> <button onclick="delRow('admin_daily','${r.id}')" class="p-1 bg-red-500/20 rounded">Del</button></td></tr>`).join("")}</tbody></table></div>`;
      }
      function renderPipeline() {
        const data = filterOwner(g("pipeline"));
        const stages = [
          "Market Map",
          "Lead",
          "Qualified",
          "Proposal",
          "Negotiation",
          "PO",
          "Delivery",
          "Handover",
        ];
        const total = data.reduce((a, b) => a + b.value, 0);
        const win = data.filter((d) => d.stage === "Handover").length;
        const rate = data.length ? ((win / data.length) * 100).toFixed(1) : 0;
        return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4"><div class="card p-4"><div class="text-xs opacity-60">Total Value</div><div class="font-bold">Rp ${(total / 1000000).toFixed(0)}Jt</div></div><div class="card p-4"><div class="text-xs opacity-60">Win Rate</div><div class="font-bold">${rate}%</div></div><div class="card p-4"><div class="text-xs opacity-60">Deals</div><div class="font-bold">${data.length}</div></div><div class="card p-4"><button onclick="openForm('pipeline')" class="w-full py-2 rounded-xl font-bold" style="background:var(--accent);color:#000">+ Deal</button></div></div><div class="overflow-x-auto"><div class="flex gap-3 min-w-[1200px]">${stages

      function renderEvaluation() {
        const data = filterOwner(g("evaluation"));

              "-S" +
              (parseInt(r.periode.split("-")[1]) <= 6 ? "1" : "2")

          const k = sem + "|" + r.sales;
          if (!sum[k]) sum[k] = { sem, sales: r.sales, c: 0, tot: 0, top: [] };

          sum[k].top.push(r.topik);

 </div>`;

  <div class="card p-5"><h3 class="font-bold mb-4">Backup & Restore</h3><div class="flex flex-wrap gap-2"><button onclick="backup()" class="px-4 py-2 rounded-xl bg-white/5">Export JSON</button><label class="px-4 py-2 rounded-xl bg-white/5 cursor-pointer">Restore JSON<input type="file" class="hidden" onchange="restore(event)"></label><button onclick="resetAll()" class="px-4 py-2 rounded-xl bg-red-500/20">Reset & Seed Ulang</button></div></div>
 </div>`;

      function saveApp() {

      function saveMenu() {
        const labels = {},
          icons = {};
        g("menu_order").forEach((id) => {
          const lb = document.getElementById("lb_" + id);
          if (lb) labels[id] = lb.value;
          const ic = document.getElementById("ic_" + id);
          if (ic) icons[id] = ic.value;
        });
        setObj("menu_labels", labels);
        setObj("menu_icons", icons);
        toast("Menu disimpan");
        renderApp();
      }
      function move(id, dir) {
        let o = g("menu_order");
        const idx = o.indexOf(id);
        const n = idx + dir;
        if (n < 0 || n >= o.length) return;
        [o[idx], o[n]] = [o[n], o[idx]];
        s("menu_order", o);
        renderModule("settings");
      }
      function setVis(id, v) {
        let vis = getObj("menu_visibility");
        vis[id] = v;
        setObj("menu_visibility", vis);

        h[k] = v;
        setObj("header_cfg", h);

      function resetMenu() {
        localStorage.removeItem("titan_menu_labels");
        localStorage.removeItem("titan_menu_icons");
        localStorage.removeItem("titan_menu_order");
        localStorage.removeItem("titan_menu_visibility");
        localStorage.removeItem("titan_app_settings");
        localStorage.removeItem("titan_header_cfg");
        seed();
        toast("Reset");
        renderApp();
      }
      function backup() {
        let obj = {};
        KEYS.forEach((k) => {
          obj[k] = JSON.parse(localStorage.getItem("titan_" + k) || "null");
        });
        const blob = new Blob([JSON.stringify(obj, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "titan_backup.json";
        a.click();
      }
      function restore(e) {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const obj = JSON.parse(r.result);
            Object.keys(obj).forEach((k) =>
              localStorage.setItem("titan_" + k, JSON.stringify(obj[k])),
            );
            toast("Restore berhasil");
            renderApp();
          } catch {
            toast("File invalid", true);
          }
        };
        r.readAsText(file);
      }
      function resetAll() {
        if (!confirm("Reset semua & seed ulang?")) return;
        KEYS.forEach((k) => localStorage.removeItem("titan_" + k));
        localStorage.removeItem("titan_current");

        toast("Reset selesai");
        renderLogin();

          label = document.getElementById("cm_label").value.trim(),
          icon = document.getElementById("cm_icon").value;

        let custom = g("custom_menus");
        if (custom.find((c) => c.id === id)) return toast("ID sudah ada", true);

          id,
          label,
          icon,
          content: `<h1>${label}</h1><p>Isi SOP / info bebas untuk ${label}</p>`,

          "menu_order",

      function changeRole(username) {
        if (username === currentUser.username)
          return toast("Tidak bisa ubah role diri sendiri", true);
        const newRole = document.getElementById("role_" + username).value;
        let users = g("users");
        const masters = users.filter((u) => u.role === "Master" && u.active);
        const target = users.find((u) => u.username === username);
        if (
          target.role === "Master" &&
          newRole !== "Master" &&
          masters.length <= 1
        )
          return toast("Tidak bisa, harus ada minimal 1 Master", true);
        users = users.map((u) =>
          u.username === username ? { ...u, role: newRole } : u,
        );
        s("users", users);
        toast("Role diubah ke " + newRole);
        renderModule("settings");
      }
      function toggleAccess(username, en) {
        let ac = getObj("access_control");
        if (!ac[username])
          ac[username] = { enabled: en, allowed: BASE_MENUS.map((m) => m.id) };
        else ac[username].enabled = en;
        setObj("access_control", ac);
        renderModule("settings");
      }
      function setAccessMenu(username, menuId, allowed) {
        let ac = getObj("access_control");
        if (!ac[username]) return;
        if (allowed) {
          if (!ac[username].allowed.includes(menuId))
            ac[username].allowed.push(menuId);
        } else {
          ac[username].allowed = ac[username].allowed.filter(
            (m) => m !== menuId,
          );
        }
        setObj("access_control", ac);
      }

      function resetPass(username) {
        if (!canManage(g("users").find((u) => u.username === username)?.role))

        if (!np) return;
        let users = g("users");
        users = users.map((u) =>
          u.username === username ? { ...u, password: np } : u,
        );
        s("users", users);
        toast("Password direset");

      function toggleActive(username) {
        if (!canManage(g("users").find((u) => u.username === username)?.role))
          return toast("Tidak berwenang", true);
        if (username === currentUser.username)
          return toast("Tidak bisa nonaktifkan diri sendiri", true);
        let users = g("users");
        const target = users.find((u) => u.username === username);
        if (target.role === "Master") {
          const masters = users.filter((u) => u.role === "Master" && u.active);
          if (masters.length <= 1 && target.active)
            return toast("Harus ada minimal 1 Master aktif", true);
        }
        users = users.map((u) =>
          u.username === username ? { ...u, active: !u.active } : u,
        );

      function delUser(username) {
        if (!canManage(g("users").find((u) => u.username === username)?.role))

          return toast("Tidak bisa hapus diri sendiri", true);
        let users = g("users");

          const masters = users.filter((u) => u.role === "Master");

            inp("product", "Product", row?.product || "") +
            inp("prob", "Prob %", row?.prob || 10, "number");
        } else if (key === "sales_forecast") {
          html +=
            custSel(row?.customer_code || "") +

              "sales",

              'id="f_sales" readonly',
            ) +
            inp(
              "pt",
              "PT (auto)",
              row?.pt || "",
              "text",
              'id="f_pt" readonly',
            ) +
            inp("part_no", "Part No", row?.part_no || "") +
            inp("deskripsi", "Deskripsi", row?.deskripsi || "") +
            inp("periode", "Periode", row?.periode || "2026-09", "month") +
            inp("t_qty", "T.Qty", row?.t_qty || 0, "number") +
            inp("t_rp", "T.Rp", row?.t_rp || 0, "number") +
            inp("actual_qty", "Actual Qty", row?.actual_qty || 0, "number") +
            inp("actual_rp", "Actual Rp", row?.actual_rp || 0, "number") +
            inp(
              "site",
              "Site",
              row?.site || "",
              "text",
              'id="f_site" readonly',
            ) +
            sel(
              "status",
              "Status",
              ["On Track", "Achieved", "Delayed", "At Risk"],
              row?.status || "On Track",
            ) +
            inp("remarks", "Remarks", row?.remarks || "");
        } else if (key === "quotation") {
          html +=
            custSel(row?.customer_code || "") +
            inp(
              "quot_no",
              "Quot No",
              row?.quot_no || "QT-" + Date.now().toString().slice(-4),
            ) +
            inp(
              "pt",
              "PT (auto)",
              row?.pt || "",
              "text",
              'id="f_pt" readonly',
            ) +
            inp(
              "tgl_quot",
              "Tgl Quot",
              row?.tgl_quot || new Date().toISOString().slice(0, 10),
              "date",
            ) +
            inp("tgl_exp", "Tgl Exp", row?.tgl_exp || "", "date") +
            inp("part", "Part", row?.part || "") +
            inp("harga", "Harga", row?.harga || 0, "number") +
            inp("qty", "Qty", row?.qty || 1, "number") +
            inp("margin_p", "Margin %", row?.margin_p || 15, "number") +
            sel(
              "po_status",
              "PO Status",
              ["Pending", "Win", "Loss", "Cancel"],
              row?.po_status || "Pending",
            ) +
            inp("loss", "Loss", row?.loss || 0, "number") +
            inp("remarks", "Remarks", row?.remarks || "");
        } else if (key === "forecast_trend") {
          html +=
            fcSel(row?.forecast_ref || "") +
            inp(
              "pt",
              "PT (auto)",
              row?.pt || "",
              "text",
              'id="f_pt" readonly',
            ) +
            inp(
              "sales",
              "Sales (auto)",
              row?.sales || "",
              "text",
              'id="f_sales" readonly',
            ) +
            inp(
              "part_no",
              "Part No (auto)",
              row?.part_no || "",
              "text",
              'id="f_part_no" readonly',
            ) +
            inp("smt1_qty", "SMT1 Qty", row?.smt1_qty || 0, "number") +
            inp("smt2_qty", "SMT2 Qty", row?.smt2_qty || 0, "number") +
            inp("actual_2025", "Actual 2025", row?.actual_2025 || 0, "number") +
            inp(
              "forecast_2026",
              "Forecast 2026",
              row?.forecast_2026 || 0,
              "number",
            ) +
            inp("alasan", "Alasan", row?.alasan || "");
        } else if (key === "actual_vs_forecast") {
          html +=
            custSel(row?.customer_code || "") +
            inp(
              "pt",
              "PT (auto)",
              row?.pt || "",
              "text",
              'id="f_pt" readonly',
            ) +
            inp("part_no", "Part No", row?.part_no || "") +
            inp("target_qty", "Target Qty", row?.target_qty || 0, "number") +
            inp("actual_qty", "Actual Qty", row?.actual_qty || 0, "number");
        } else if (key === "documentation") {
          html +=
            custSel(row?.customer_code || "") +
            inp("nama", "Nama Dokumen", row?.nama || "") +
            `<div><label class="text-xs opacity-60">File Base64</label><input type="file" id="f_file" class="w-full text-xs mt-1"></div>`;
        } else if (key === "refreshment") {
          html +=
            inp(
              "tanggal",
              "Tanggal",
              row?.tanggal || new Date().toISOString().slice(0, 10),
              "date",
            ) +
            sel(
              "jenis",
              "Jenis",
              ["Weekly Brainstorming", "Monthly Test"],
              row?.jenis || "Weekly Brainstorming",
            ) +
            inp("topik", "Topik", row?.topik || "") +
            inp("durasi", "Durasi Menit", row?.durasi || 30, "number") +
            inp("peserta", "Peserta", row?.peserta || currentUser.username) +
            inp("nilai", "Nilai", row?.nilai || "") +
            inp("ringkasan", "Ringkasan", row?.ringkasan || "") +
            sel(
              "status",
              "Status",
              ["Terjadwal", "Selesai", "Dibatalkan"],
              row?.status || "Terjadwal",
            );
        } else if (key === "evaluation") {
          html +=
            inp("periode", "Periode", row?.periode || "2026-08", "month") +
            inp("sales", "Sales", row?.sales || currentUser.username) +
            inp("topik", "Topik/Isu", row?.topik || "") +
            inp("deskripsi", "Deskripsi", row?.deskripsi || "") +
            inp("skor", "Skor 1-100", row?.skor || 75, "number") +
            `<div><label class="text-xs opacity-60">Foto Base64</label><input type="file" id="f_file" accept="image/*" class="w-full text-xs mt-1"></div>` +
            inp("tindak", "Tindak Lanjut", row?.tindak || "") +
            sel(
              "status",
              "Status",
              ["Open", "In Progress", "Closed"],
              row?.status || "Open",
            );
        } else if (key === "users") {
          const isEdit = !!id;
          html +=
            inp("name", "Nama Lengkap", row?.name || "") +
            inp("username", "Username", row?.username || "") +
            inp("password", "Password", row?.password || "", "password") +
            sel(
              "role",
              "Role",
              currentUser.role === "Master"
                ? ["Sales", "Admin", "Master"]
                : ["Sales"],
              row?.role || "Sales",
            ) +
            inp("securityQ", "Pertanyaan Keamanan", row?.securityQ || "") +
            inp("securityA", "Jawaban", row?.securityA || "") +
            sel(
              "active",
              "Status",
              ["Aktif", "Nonaktif"],
              row?.active ? "Aktif" : "Nonaktif",
            );
        }
        html += `</div><div class="flex gap-2 mt-6"><button onclick="saveForm('${key}','${id || ""}')" class="flex-1 py-3 rounded-xl font-bold" style="background:var(--accent);color:#000">Simpan</button><button onclick="closeModal()" class="px-6 py-3 rounded-xl bg-white/5">Batal</button></div>`;
        openModal(html);
      }
      function onCust(code) {
        const c = g("customers").find((x) => x.customer_code === code);
        if (!c) return;
        const set = (i, v) => {
          const e = document.getElementById(i);
          if (e) e.value = v || "";
        };
        set("f_pt", c.pt);
        set("f_pic", c.pic);
        set("f_wa", c.wa);
        set("f_site", c.site);
        set("f_sales", c.sales);
      }
      function onFc(id) {
        const f = g("sales_forecast").find((x) => x.id === id);
        if (!f) return;
        const set = (i, v) => {
          const e = document.getElementById(i);
          if (e) e.value = v || "";
        };
        set("f_pt", f.pt);
        set("f_sales", f.sales);
        set("f_part_no", f.part_no);
      }

      async function saveForm(key, editId) {
        const gv = (n) => document.getElementById("f_" + n)?.value || "";
        let data = g(key);
        let obj = {};
        if (key === "customers") {
          obj = {
            pt: gv("pt"),
            pic: gv("pic"),
            wa: gv("wa"),
            email: gv("email"),
            jabatan: gv("jabatan"),
            site: gv("site"),
            note: gv("note"),
            sales: gv("sales"),
          };
          if (!obj.pt) return toast("PT wajib", true);
          if (!editId) {
            const last = data.length
              ? parseInt(data[data.length - 1].customer_code.split("-")[1])
              : 0;
            obj.customer_code = "CUST-" + String(last + 1).padStart(4, "0");
          }
        } else if (key === "sales_daily") {
          const code = gv("customer_code");
          if (!code) return toast("Pilih Customer Code", true);
          obj = {
            customer_code: code,
            type: gv("type"),
            pt: gv("pt"),
            pic: gv("pic"),
            wa: gv("wa"),
            site: gv("site"),
            status: gv("status"),
            note: gv("note"),
            absensi: gv("absensi"),
          };
          const fe = document.getElementById("f_file");
          if (fe?.files[0]) {
            obj.attachment = await fileToBase64(fe.files[0]);
          }
        } else if (key === "admin_daily") {
          const code = gv("customer_code");
          if (!code) return toast("Customer Code wajib", true);
          obj = {
            customer_code: code,
            type: gv("type"),
            ref_no: gv("ref_no"),
            pt: gv("pt"),
            dokumen: gv("dokumen"),
            status: gv("status"),
          };
        } else if (key === "pipeline") {
          const code = gv("customer_code");
          if (!code) return toast("Customer Code wajib", true);
          obj = {
            customer_code: code,
            pt: gv("pt"),
            sales: gv("sales") || currentUser.username,
            stage: gv("stage"),
            value: parseInt(gv("value")) || 0,
            product: gv("product"),
            prob: parseInt(gv("prob")) || 10,
          };
        } else if (key === "sales_forecast") {
          const code = gv("customer_code");
          if (!code) return toast("Customer Code wajib", true);
          obj = {
            customer_code: code,
            sales: gv("sales"),
            pt: gv("pt"),
            part_no: gv("part_no"),
            deskripsi: gv("deskripsi"),
            periode: gv("periode"),
            t_qty: parseInt(gv("t_qty")) || 0,
            t_rp: parseInt(gv("t_rp")) || 0,
            actual_qty: parseInt(gv("actual_qty")) || 0,
            actual_rp: parseInt(gv("actual_rp")) || 0,
            site: gv("site"),
            status: gv("status"),
            remarks: gv("remarks"),
          };
        } else if (key === "quotation") {
          const code = gv("customer_code");
          if (!code) return toast("Customer Code wajib", true);
          const h = parseInt(gv("harga")) || 0,
            q = parseInt(gv("qty")) || 0,
            mp = parseInt(gv("margin_p")) || 0;
          obj = {
            customer_code: code,
            quot_no: gv("quot_no"),
            pt: gv("pt"),
            tgl_quot: gv("tgl_quot"),
            tgl_exp: gv("tgl_exp"),
            part: gv("part"),
            harga: h,
            qty: q,
            total: h * q,
            margin_p: mp,
            margin_rp: Math.round((h * q * mp) / 100),
            po_status: gv("po_status"),
            loss: gv("loss"),
            remarks: gv("remarks"),
          };
        } else if (key === "forecast_trend") {
          obj = {
            forecast_ref: gv("forecast_ref"),
            pt: gv("pt"),
            sales: gv("sales"),
            part_no: gv("part_no"),
            smt1_qty: parseInt(gv("smt1_qty")) || 0,
            smt2_qty: parseInt(gv("smt2_qty")) || 0,
            actual_2025: parseInt(gv("actual_2025")) || 0,
            forecast_2026: parseInt(gv("forecast_2026")) || 0,
            alasan: gv("alasan"),
          };
          if (!obj.forecast_ref) return toast("Pilih referensi forecast", true);
        } else if (key === "actual_vs_forecast") {
          const code = gv("customer_code");
          if (!code) return toast("Customer Code wajib", true);
          obj = {
            customer_code: code,
            pt: gv("pt"),
            part_no: gv("part_no"),
            target_qty: parseInt(gv("target_qty")) || 0,
            actual_qty: parseInt(gv("actual_qty")) || 0,
          };
        } else if (key === "documentation") {
          obj = { customer_code: gv("customer_code"), nama: gv("nama") };
          const fe = document.getElementById("f_file");
          if (fe?.files[0]) {
            obj.file = await fileToBase64(fe.files[0]);
            obj.fileName = fe.files[0].name;
          }
        } else if (key === "refreshment") {
          obj = {
            tanggal: gv("tanggal"),
            jenis: gv("jenis"),
            topik: gv("topik"),
            durasi: parseInt(gv("durasi")) || 0,
            peserta: gv("peserta"),
            nilai: gv("nilai"),
            ringkasan: gv("ringkasan"),
            status: gv("status"),
          };
        } else if (key === "evaluation") {
          obj = {
            periode: gv("periode"),
            sales: gv("sales"),
            topik: gv("topik"),
            deskripsi: gv("deskripsi"),
            skor: parseInt(gv("skor")) || 0,
            tindak: gv("tindak"),
            status: gv("status"),
          };
          const fe = document.getElementById("f_file");
          if (fe?.files[0]) obj.foto = await fileToBase64(fe.files[0]);
        } else if (key === "users") {
          const active = gv("active") === "Aktif";
          const role = gv("role");
          if (currentUser.role === "Admin" && role !== "Sales")
            return toast("Admin hanya bisa buat Sales", true);
          obj = {
            name: gv("name"),
            username: gv("username"),
            password: gv("password"),
            role,
            securityQ: gv("securityQ"),
            securityA: gv("securityA").toLowerCase(),
            active,
            createdAt: row?.createdAt || new Date().toISOString(),
          };
          if (!obj.username || !obj.password)
            return toast("Username & password wajib", true);
          if (editId) {
            let users = g("users");
            if (!canManage(users.find((u) => u.username === editId)?.role))
              return toast("Tidak berwenang", true);
            if (
              editId !== obj.username &&
              users.find((u) => u.username === obj.username)
            )
              return toast("Username sudah ada", true);
            users = users.map((u) =>
              u.username === editId ? { ...u, ...obj } : u,
            );
            s("users", users);
            toast("Akun diupdate");
            closeModal();
            renderModule(activeMenu);
            return;
          } else {
            let users = g("users");
            if (users.find((u) => u.username === obj.username))
              return toast("Username ada", true);
            users.push(obj);
            s("users", users);
            toast("Akun ditambah");
            closeModal();
            renderModule(activeMenu);
            return;
          }
        }
        if (editId) {
          data = data.map((r) => (r.id === editId ? { ...r, ...obj } : r));
        } else {
          obj.id = uid();
          obj.owner = currentUser.username;
          obj.createdAt = new Date().toISOString();
          data.push(obj);
        }
        s(key, data);
        toast("Disimpan");
        closeModal();
        renderModule(activeMenu);
      }

      seed();
      applyTheme();
      if (currentUser) renderApp();
      else renderLogin();
    </script>
  </body>
</html>
